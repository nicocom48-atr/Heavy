name: Release HeavyDrop (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del Tag para la Release (ej. v0.2.0)'
        required: true
        default: 'v0.2.0'
      draft:
        description: 'Crear como borrador (Draft)'
        type: boolean
        default: false
      prerelease:
        description: 'Marcar como pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build binary in Release mode
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package Windows Binary
        id: package
        shell: pwsh
        run: |
          $TAG = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag_name }}" }
          $ARCHIVE = "heavydrop-${TAG}-windows-x64.zip"

          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/x86_64-pc-windows-msvc/release/heavydrop.exe" -Destination "staging/heavydrop.exe"
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "staging/README.md" }

          New-Item -ItemType Directory -Force -Path artifacts
          Compress-Archive -Path "staging/*" -DestinationPath "artifacts/$ARCHIVE" -Force

          Set-Location artifacts
          $hash = (Get-FileHash -Algorithm SHA256 -Path $ARCHIVE).Hash.ToLower()
          "$hash  $ARCHIVE" | Out-File -Encoding ascii -NoNewline "$ARCHIVE.sha256"

          Write-Output "archive_name=$ARCHIVE" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          name: HeavyDrop ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: artifacts/*
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
