name: Release HeavyDrop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del Tag para la Release (ej. v0.1.0)'
        required: true
        default: 'v0.1.0'
      draft:
        description: 'Crear como borrador (Draft)'
        type: boolean
        default: false
      prerelease:
        description: 'Marcar como pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: heavydrop.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: heavydrop
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: heavydrop
          - os: macos-13
            target: x86_64-apple-darwin
            binary: heavydrop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Dependencias nativas de Linux para eframe (egui) y rfd (GTK3 / X11 / Wayland)
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgtk-3-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary in Release mode
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Empaquetado en Windows (.zip + sha256)
      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAG = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag_name }}" }
          $ARCHIVE = "heavydrop-${TAG}-${{ matrix.target }}.zip"
          
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" -Destination "staging/${{ matrix.binary }}"
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "staging/README.md" }
          
          New-Item -ItemType Directory -Force -Path artifacts
          Compress-Archive -Path "staging/*" -DestinationPath "artifacts/$ARCHIVE" -Force
          
          Set-Location artifacts
          $hash = (Get-FileHash -Algorithm SHA256 -Path $ARCHIVE).Hash.ToLower()
          "$hash  $ARCHIVE" | Out-File -Encoding ascii -NoNewline "$ARCHIVE.sha256"

      # Empaquetado en Linux y macOS (.tar.gz + sha256)
      - name: Package Unix Binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag_name }}"
          fi
          ARCHIVE="heavydrop-${TAG}-${{ matrix.target }}.tar.gz"
          
          mkdir -p staging artifacts
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "staging/${{ matrix.binary }}"
          [ -f README.md ] && cp README.md staging/
          
          tar -czvf "artifacts/${ARCHIVE}" -C staging .
          
          cd artifacts
          if command -v sha256sum &> /dev/null; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: assets-*
          merge-multiple: true

      - name: List downloaded files
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          name: HeavyDrop ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
